apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
  labels:
    app: crochetcraft
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/data/mysql
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  labels:
    app: crochetcraft
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  labels:
    app: crochetcraft
type: Opaque
stringData:
  mysql-root-password: "1234"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-container
  labels:
    app: crochetcraft
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crochetcraft
      component: database
  template:
    metadata:
      labels:
        app: crochetcraft
        component: database
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: myapplication
          ports:
            - containerPort: 3306
              name: mysql
          volumeMounts:
            - name: mysql-persistent-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-persistent-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-container
  labels:
    app: crochetcraft
    component: database
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: crochetcraft
    component: database
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-app
  labels:
    app: crochetcraft
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crochetcraft
      component: backend
  template:
    metadata:
      labels:
        app: crochetcraft
        component: backend
    spec:
      containers:
        - name: springboot-app
          image: sushmitacb/crochetcraft-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-container:3306/myapplication?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
            - name: SPRING_JPA_DATABASE_PLATFORM
              value: org.hibernate.dialect.MySQLDialect
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
---
apiVersion: v1
kind: Service
metadata:
  name: springboot-app-service
  labels:
    app: crochetcraft
    component: backend
spec:
  ports:
    - port: 8085
      targetPort: 8080
      nodePort: 30085
  selector:
    app: crochetcraft
    component: backend
  type: NodePort
